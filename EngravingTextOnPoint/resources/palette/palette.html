<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engraving Text on Point</title>
  <link rel="stylesheet" href="static/palette.css" />
</head>
<body>
  <!--
    Wireframe shell for the stock-like Fusion palette.
    Behavior and Fusion bridge land in Phase 1 (see docs/PLAN.md).
  -->
  <div class="palette">
    <section class="block" aria-label="Selection">
      <div class="field-row">
        <span class="icon-slot" title="Sketch point"></span>
        <label>Point(s)</label>
        <button type="button" class="btn" id="btn-points" disabled>Select</button>
        <button type="button" class="btn" id="btn-add-point" title="Add point at click">+ Add Point</button>
        <span class="muted" id="points-count">0 selected</span>
      </div>
      <div class="field-row">
        <span class="icon-slot" title="Reference point"></span>
        <label>Ref Pt</label>
        <button type="button" class="btn" id="btn-ref">Select</button>
        <button type="button" class="btn" id="btn-apply-ref" title="Apply to active unconstrained point">Apply Ref Dims</button>
        <span class="muted" id="ref-label">New or existing free pts</span>
      </div>
      <div class="field-row">
        <span class="icon-slot" title="Sketch"></span>
        <label>Sketch</label>
        <button type="button" class="btn" id="btn-sketch" disabled>Select</button>
        <span class="muted" id="sketch-label">Optional for Add Point</span>
      </div>
      <div class="field-row">
        <span class="icon-slot" title="Orientation vector"></span>
        <label>Orient</label>
        <button type="button" class="btn" id="btn-orient">Select</button>
        <span class="muted" id="orient-label">Required for angle</span>
      </div>
      <div class="field-row" id="target-row">
        <span class="icon-slot" title="Target body"></span>
        <label>Target Body</label>
        <button type="button" class="btn" id="btn-body" disabled>Select</button>
        <span class="muted" id="body-label">Cut only</span>
      </div>
      <p class="muted" id="manip-status" role="status">
        Manipulators: Angle dim (needs Orient) · Move (active row)
      </p>
    </section>

    <section class="block" aria-label="Extrude">
      <div class="field-row">
        <label>Operation</label>
        <label class="radio"><input type="radio" name="op" value="cut" checked /> Cut</label>
        <label class="radio"><input type="radio" name="op" value="newBody" /> New Body</label>
      </div>
      <div class="field-row">
        <label for="distance">Distance</label>
        <input id="distance" type="text" value="1 mm" />
      </div>
      <div class="field-row">
        <label class="check">
          <input type="checkbox" id="live-preview" checked /> Live preview
        </label>
      </div>
    </section>

    <section class="block" aria-label="Batch">
      <label class="check"><input type="checkbox" id="batch-enabled" /> Batch sequence</label>
      <div class="batch-grid" id="batch-grid" hidden>
        <label>Prefix <input id="batch-prefix" type="text" value="" /></label>
        <label>Suffix <input id="batch-suffix" type="text" value="" /></label>
        <label>Start <input id="batch-start" type="number" value="1" /></label>
        <label>Digits <input id="batch-digits" type="number" value="3" min="1" /></label>
        <label>Step <input id="batch-step" type="number" value="1" /></label>
      </div>
    </section>

    <section class="block table-block" aria-label="Text table">
      <table class="data-table" id="text-table">
        <thead>
          <tr>
            <th class="col-idx">#</th>
            <th class="col-text">Text</th>
            <th class="col-ht">Ht</th>
            <th class="col-angle">Angle</th>
            <th class="col-orient">Orient</th>
            <th class="col-flip">Flip</th>
            <th class="col-justify">Justify</th>
            <th class="col-align">Align</th>
            <th class="col-font">Font</th>
          </tr>
        </thead>
        <tbody id="text-tbody">
          <tr class="empty">
            <td colspan="9">Select sketch points to add rows</td>
          </tr>
          <!--
            Per-row icon cells (Phase 1) — stock Fusion 16x16 PNGs:
            Flip:    flipH / flipV toggles (aria-pressed)
            Justify: justifyLeft|Center|Right radio group (default Center)
            Align:   alignTop|Middle|Bottom radio group (default Middle)
          -->
        </tbody>
      </table>
    </section>

    <section class="block footer">
      <div class="field-row">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="light" selected>Light</option>
          <option value="dark">Dark</option>
          <option value="auto">Auto</option>
        </select>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="btn-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-ok" disabled>OK</button>
      </div>
    </section>

    <p class="status muted" id="status" role="status"></p>
  </div>
  <script src="static/palette.js"></script>
</body>
</html>
